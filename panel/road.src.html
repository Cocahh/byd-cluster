<meta charset="utf-8">
<title>King Driver Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face { font-family: "NHD"; font-weight: 300; src: url("{{font:nhd-light.woff}}") format("woff"); }
@font-face { font-family: "NHD"; font-weight: 400; src: url("{{font:nhd-roman.woff}}") format("woff"); }
@font-face { font-family: "NHD"; font-weight: 500; src: url("{{font:nhd-mediu.woff}}") format("woff"); }
:root {
  --bg: #F1F1EF;
  --fg: #121212;
  --muted: #64645F;
  --line: #D7D7D3;
  --btn: #FFFFFF;
  --btn-on: #121212;
  --btn-on-fg: #F1F1EF;
  --k-bg: #000000;
  --k-fg: #F3F3F1;
  --k-dim: #8A8A86;
  --k-faint: #3A3A38;
  --k-track: #1F1F1E;
  --k-accent: #FF7A1A;
  --k-turn: #3CC46E;
  --f: "NHD", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0A0A; --fg: #EDEDEB; --muted: #8E8E89; --line: #242424;
    --btn: #151515; --btn-on: #EDEDEB; --btn-on-fg: #0A0A0A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0A0A; --fg: #EDEDEB; --muted: #8E8E89; --line: #242424;
  --btn: #151515; --btn-on: #EDEDEB; --btn-on-fg: #0A0A0A; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1180px; margin: 0 auto; padding-block: 40px 56px; display: grid; gap: 22px; }
.head { display: grid; gap: 6px; }
.head h1 { margin: 0; font-size: clamp(28px, 4vw, 38px); font-weight: 500; letter-spacing: 0; }
.head p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.45; max-width: 58ch; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls button { font: 500 15px/1 var(--f); color: var(--fg); background: var(--btn); border: 1px solid var(--line); border-radius: 6px; padding: 11px 15px; cursor: pointer; }
.controls button[aria-pressed="true"] { background: var(--btn-on); color: var(--btn-on-fg); border-color: var(--btn-on); }
.controls button:focus-visible { outline: 2px solid var(--k-accent); outline-offset: 2px; }
.controls .sep { width: 1px; height: 24px; background: var(--line); margin-inline: 4px; }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1280 / 480; border-radius: 14px; overflow: hidden; background: var(--k-bg); }
.credit { color: var(--muted); font-size: 13px; line-height: 1.5; }

.k { position: absolute; left: 0; top: 0; width: 1280px; height: 480px; transform-origin: 0 0; background: var(--k-bg); color: var(--k-fg); font-family: var(--f); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; overflow: hidden; user-select: none; letter-spacing: 0; }
.k * { box-sizing: border-box; }
.k canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 480px; }

.k .mode { position: absolute; left: 60px; top: 42px; display: flex; gap: 14px; align-items: baseline; font-size: 19px; }
.k .mode b { font-weight: 500; color: var(--k-fg); transition: color .5s var(--ease); }
.k .mode b.fuel { color: var(--k-accent); }
.k .mode b.idle { color: var(--k-dim); }
.k .mode span { color: var(--k-dim); font-weight: 400; }
.k .speed { position: absolute; left: 52px; top: 72px; font-size: 176px; line-height: 1; font-weight: 400; }
.k .unit { position: absolute; left: 62px; top: 246px; font-size: 20px; color: var(--k-dim); font-weight: 400; }
.k .gears { position: absolute; left: 61px; top: 300px; display: flex; gap: 24px; font-size: 24px; font-weight: 500; }
.k .gears span { color: var(--k-faint); transition: color .35s var(--ease); }
.k .gears span.on { color: var(--k-fg); }
.k .stores { position: absolute; left: 62px; top: 362px; width: 330px; display: grid; gap: 18px; }
.k .row { display: grid; grid-template-columns: 64px 1fr 48px 66px; gap: 14px; align-items: center; font-size: 16px; color: var(--k-dim); }
.k .row .v { color: var(--k-fg); text-align: right; font-weight: 500; }
.k .row .r { text-align: right; }
.k .bar { position: relative; height: 3px; border-radius: 2px; background: var(--k-track); overflow: hidden; }
.k .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--k-fg); border-radius: 2px; transition: width .6s var(--ease); }
.k .bar.fuel i { background: var(--k-accent); }

.k .clock { position: absolute; right: 60px; top: 42px; display: flex; gap: 18px; font-size: 19px; color: var(--k-dim); }
.k .clock b { color: var(--k-fg); font-weight: 400; }
.k .turn { position: absolute; top: 40px; width: 26px; height: 22px; color: var(--k-faint); transition: color .08s linear; }
.k .turn.on { color: var(--k-turn); }
.k .turn.l { left: 800px; } .k .turn.r { left: 880px; }
.k .turn svg { width: 100%; height: 100%; display: block; fill: currentColor; }

.k .car { position: absolute; left: 725px; top: 238px; width: 250px; height: 207px; will-change: transform, opacity; }
.k .car img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.k .car .sig { opacity: 0; transition: opacity .09s linear; }
.k .car .sig.on { opacity: 1; transition-duration: .03s; }
.k .car .shadow { position: absolute; left: 8%; right: 8%; bottom: -10px; height: 34px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.95), rgba(0,0,0,0)); }

.k.intro .car { opacity: 0; transform: translateY(14px); }
.k.intro .speed, .k.intro .unit, .k.intro .gears, .k.intro .stores, .k.intro .mode, .k.intro .clock { opacity: 0; transform: translateY(6px); }
.k .speed, .k .unit, .k .gears, .k .stores, .k .mode, .k .clock { transition: opacity .7s var(--ease), transform .7s var(--ease); }
.k.on .car { transition: opacity 1.1s var(--ease) .25s, transform 1.1s var(--ease) .25s; }
.k.on .unit, .k.on .gears { transition-delay: .5s; }
.k.on .stores { transition-delay: .65s; }
.k.on .clock { transition-delay: .75s; }

body.car { padding: 0; background: #000; overflow: hidden; }
body.car .page { display: block; max-width: none; padding: 0; height: 100%; }
body.car .head, body.car .controls, body.car .credit { display: none; }
body.car .stage { width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; }
@media (prefers-reduced-motion: reduce) { .k * { transition: none !important; } }
</style>

<div class="page">
  <header class="head">
    <h1>King Driver Panel</h1>
    <p>Your King from behind, holding the road. Speed, gear, battery and fuel on the left. Running a simulated drive.</p>
  </header>

  <div class="controls" role="group" aria-label="Simulated drive">
    <button id="sc-city" type="button" data-sc="city" aria-pressed="false">City</button>
    <button id="sc-highway" type="button" data-sc="highway" aria-pressed="true">Highway</button>
    <button id="sc-parked" type="button" data-sc="parked" aria-pressed="false">Parked</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="sc-start" type="button">Start car</button>
    <button id="sc-pause" type="button" aria-pressed="false">Pause</button>
  </div>

  <div class="stage" id="stage">
    <div class="k intro" id="k">
      <canvas id="road" width="1280" height="480"></canvas>
      <div class="car" id="car">
        <div class="shadow"></div>
        <img id="c-tail" alt="" src="{{img:king-tail.png}}">
        <img id="c-lights" alt="" src="{{img:king-lights.png}}" style="opacity:0">
        <img id="c-turnL" class="sig" alt="" src="{{img:king-turnL.png}}">
        <img id="c-turnR" class="sig" alt="" src="{{img:king-turnR.png}}">
      </div>

      <div class="mode"><b id="mode" class="idle">Ready</b><span id="kw">0 kW</span></div>
      <div class="speed" id="speed">0</div>
      <div class="unit">km/h</div>
      <div class="gears" id="gears"><span>P</span><span>R</span><span>N</span><span>D</span></div>
      <div class="stores">
        <div class="row"><span>Battery</span><div class="bar"><i id="socBar"></i></div><span class="v" id="soc">0%</span><span class="r" id="evr">0 km</span></div>
        <div class="row"><span>Fuel</span><div class="bar fuel"><i id="fuelBar"></i></div><span class="v" id="fuel">0%</span><span class="r" id="tr">0 km</span></div>
      </div>
      <div class="turn l" id="turnL"><svg viewBox="0 0 26 22"><path d="M0 11 12 0v7h14v8H12v7z"/></svg></div>
      <div class="turn r" id="turnR"><svg viewBox="0 0 26 22"><path d="M26 11 14 0v7H0v8h14v7z"/></svg></div>
      <div class="clock"><span id="temp">0°C</span><b id="clock">00:00</b></div>
    </div>
  </div>

  <p class="credit">3D model: 2025 BYD Seal 5 DM-i by ddiaz-design on Sketchfab, CC BY-NC-SA 4.0. Typeface: Neue Haas Display.</p>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var K = $("k"), stage = $("stage");
  var hash = location.hash.replace("#", "");
  var carMode = /^car/.test(hash);
  if (carMode) document.body.classList.add("car");

  function fit() {
    var w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
    var s = carMode ? Math.min(w / 1280, h / 480) : w / 1280;
    var ox = carMode ? (w - 1280 * s) / 2 : 0, oy = carMode ? (h - 480 * s) / 2 : 0;
    K.style.transform = "translate(" + ox + "px," + oy + "px) scale(" + s + ")";
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  window.addEventListener("resize", fit); fit();

  var cv = $("road"), ctx = cv.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = 1280 * dpr; cv.height = 480 * dpr; ctx.scale(dpr, dpr);

  var HY = 58, VX = 850, KY = 394, KX = 115, ZC = 6;
  var LANES = [-5.4, -1.8, 1.8, 5.4];

  function sy(u) { return HY + KY * u; }
  function sx(X, u) { return VX + KX * X * u; }
  function smooth(a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

  var leftFade = ctx.createLinearGradient(430, 0, 600, 0);
  leftFade.addColorStop(0, "rgba(0,0,0,1)"); leftFade.addColorStop(1, "rgba(0,0,0,0)");
  var rightFade = ctx.createLinearGradient(1170, 0, 1280, 0);
  rightFade.addColorStop(0, "rgba(0,0,0,0)"); rightFade.addColorStop(1, "rgba(0,0,0,1)");
  var roadFill = ctx.createLinearGradient(0, HY + 20, 0, 480);
  roadFill.addColorStop(0, "rgba(22,22,21,0)"); roadFill.addColorStop(0.45, "rgba(22,22,21,0.7)"); roadFill.addColorStop(1, "rgba(28,28,27,1)");

  function drawRoad(dist, egoX, reveal) {
    ctx.clearRect(0, 0, 1280, 480);
    var uMin = 0.035, uMax = 1.12;
    var e0 = -9 - egoX, e1 = 9 - egoX;
    ctx.fillStyle = roadFill;
    ctx.beginPath();
    ctx.moveTo(sx(e0, uMax), sy(uMax)); ctx.lineTo(sx(e1, uMax), sy(uMax));
    ctx.lineTo(sx(e1, uMin), sy(uMin)); ctx.lineTo(sx(e0, uMin), sy(uMin)); ctx.closePath(); ctx.fill();

    var lane = Math.round(egoX / 3.6) * 3.6 - egoX, l0 = lane - 1.8, l1 = lane + 1.8, um = Math.max(uMin, reveal);
    var laneFill = ctx.createLinearGradient(0, sy(0.06), 0, 480);
    laneFill.addColorStop(0, "rgba(255,255,255,0)"); laneFill.addColorStop(1, "rgba(255,255,255," + (0.045 * (1 - smooth(0, 0.6, reveal))).toFixed(4) + ")");
    ctx.fillStyle = laneFill;
    ctx.beginPath();
    ctx.moveTo(sx(l0, uMax), sy(uMax)); ctx.lineTo(sx(l1, uMax), sy(uMax));
    ctx.lineTo(sx(l1, um), sy(um)); ctx.lineTo(sx(l0, um), sy(um)); ctx.closePath(); ctx.fill();

    for (var li = 0; li < LANES.length; li++) {
      var X = LANES[li] - egoX, outer = li === 0 || li === LANES.length - 1;
      var step = 0.75;
      for (var Z = ZC / uMax; Z < 170; Z += step) {
        var Z2 = Z + step;
        if (!outer) { var ph = ((Z + dist) % 12 + 12) % 12; if (ph > 4) continue; }
        var u1 = ZC / Z, u2 = ZC / Z2;
        if (u1 < reveal) continue;
        var a = (outer ? 0.26 : 0.55) * smooth(uMin, 0.32, u2);
        if (a < 0.01) continue;
        var hw = Math.max(0.6, 0.028 * KX * u1) / (KX * u1);
        ctx.fillStyle = "rgba(235,235,230," + a.toFixed(3) + ")";
        ctx.beginPath();
        ctx.moveTo(sx(X - hw, u1), sy(u1)); ctx.lineTo(sx(X + hw, u1), sy(u1));
        ctx.lineTo(sx(X + hw, u2), sy(u2)); ctx.lineTo(sx(X - hw, u2), sy(u2)); ctx.closePath(); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = leftFade; ctx.fillRect(0, 0, 600, 480);
    ctx.fillStyle = rightFade; ctx.fillRect(1170, 0, 110, 480);
    ctx.globalCompositeOperation = "source-over";
  }

  var MAX_KW = 145, MIN_KW = -48;
  var shown = { speed: 0, kw: 0, dist: 0, brake: 0, reveal: 1.2 };
  var target = null, lastSpeed = 0, introAt = 0;
  var sigL = $("c-turnL"), sigR = $("c-turnR");
  var nf = function (n) { return Math.round(n).toLocaleString("pt-BR"); };

  function modeOf(s) {
    if (s.gear === "P" && s.engineOn) return ["Engine charging", "fuel"];
    if (s.gear === "P") return ["Ready", "idle"];
    if (s.engineOn) return ["Hybrid", "fuel"];
    return ["EV", ""];
  }

  function apply(s) {
    target = s;
    var m = modeOf(s); $("mode").textContent = m[0]; $("mode").className = m[1];
    Array.prototype.forEach.call($("gears").children, function (g) { g.className = g.textContent === s.gear ? "on" : ""; });
    $("soc").textContent = Math.round(s.soc) + "%"; $("socBar").style.width = s.soc + "%";
    $("fuel").textContent = Math.round(s.fuelPct) + "%"; $("fuelBar").style.width = s.fuelPct + "%";
    $("evr").textContent = nf(s.evRangeKm) + " km"; $("tr").textContent = nf(s.totalRangeKm) + " km";
    $("temp").textContent = Math.round(s.outsideC) + "°C"; $("clock").textContent = s.clock;
    $("turnL").className = "turn l" + (s.turnL ? " on" : ""); $("turnR").className = "turn r" + (s.turnR ? " on" : "");
    sigL.className = "sig" + (s.turnL ? " on" : ""); sigR.className = "sig" + (s.turnR ? " on" : "");
  }

  function start() {
    K.classList.remove("on"); K.classList.add("intro");
    void K.offsetWidth;
    K.classList.add("on"); K.classList.remove("intro");
    introAt = Date.now(); shown.reveal = 1.2;
  }

  var lightsEl = $("c-lights");
  var lastT = Date.now();

  function frame() {
    var now = Date.now(), dt = Math.min((now - lastT) / 1000, 0.1); lastT = now;
    var s = target; if (!s) return;
    shown.speed += (s.speed - shown.speed) * Math.min(1, dt * 9);
    shown.kw += (s.powerKw - shown.kw) * Math.min(1, dt * 6);
    var v = shown.speed / 3.6;
    shown.dist += v * dt;
    $("speed").textContent = Math.round(shown.speed);
    $("kw").textContent = Math.round(shown.kw) + " kW";

    var accel = (s.speed - lastSpeed) / 3.6 / Math.max(dt, 0.001); lastSpeed = s.speed;
    var wantBrake = s.gear !== "P" && (accel < -0.8 || s.powerKw < -6) ? 1 : 0;
    shown.brake += (wantBrake - shown.brake) * Math.min(1, dt * (wantBrake ? 14 : 5));

    var t = (now - introAt) / 1000;
    shown.reveal = introAt ? Math.max(0, 1.15 - smooth(0, 1.3, t) * 1.15) : 0;
    drawRoad(shown.dist, 0, shown.reveal);

    lightsEl.style.opacity = shown.brake.toFixed(3);
  }
  setInterval(frame, 33);

  window.KingPanel = { update: apply, start: start };

  var SCENES = {
    city: [[0, 0, "P"], [3, 0, "D"], [5, 28], [11, 46], [17, 48], [22, 0], [27, 0], [29, 34, 0, "L"], [36, 52], [43, 58], [48, 22], [52, 22, 0, "R"], [57, 0], [61, 0]],
    highway: [[0, 96, "D"], [6, 108], [12, 112], [18, 112, 0, "L", -1], [26, 118], [34, 104], [40, 104, 0, "R", 0], [48, 112], [54, 98], [60, 96]],
    parked: [[0, 0, "P"], [60, 0]]
  };
  var sim = { scene: "highway", t: 0, paused: false, speed: 0, soc: 64, fuel: 72, odo: 18432, trip: 12.4, fuelUsedL: 0.48, kwhUsed: 1.76, engineOn: false, last: null, lane: 0 };

  function sceneAt(name, t) {
    var k = SCENES[name], dur = k[k.length - 1][0], tt = t % dur, gear = "D", turn = null, lane = 0;
    for (var i = 0; i < k.length; i++) if (k[i][0] <= tt) { if (k[i][2]) gear = k[i][2]; if (typeof k[i][4] === "number") lane = k[i][4]; }
    for (i = 0; i < k.length - 1; i++) {
      if (tt >= k[i][0] && tt < k[i + 1][0]) {
        if (k[i][3] && tt - k[i][0] < 3.5) turn = k[i][3];
        var a = k[i], b = k[i + 1], f = (tt - a[0]) / (b[0] - a[0]);
        return { speed: a[1] + (b[1] - a[1]) * f, gear: gear, turn: turn, lane: lane, tt: tt };
      }
    }
    return { speed: k[k.length - 1][1], gear: gear, turn: null, lane: lane, tt: tt };
  }

  function step(dt) {
    sim.t += dt;
    var sc = sceneAt(sim.scene, sim.t), prev = sim.speed;
    sim.speed = sc.speed;
    var v = sim.speed / 3.6, a = dt < 0.01 ? 0 : (sim.speed - prev) / 3.6 / dt;
    var kw = (1650 * a + 0.5 * 1.2 * 0.62 * 2.35 * v * v + 160) * v / 1000;
    if (kw < 0) kw = Math.max(kw, MIN_KW);
    if (sc.gear === "P") kw = 0;
    sim.engineOn = sc.gear === "P" ? sim.soc < 25 : (sim.speed > 78 || kw > 70 || sim.soc < 25);
    var hrs = dt / 3600, boost = 6;
    if (kw < 0) sim.soc += (-kw * hrs * boost) / 18.3 * 100;
    else if (!sim.engineOn) { sim.soc -= (kw * hrs * boost) / 18.3 * 100; sim.kwhUsed += kw * hrs * boost; }
    if (sim.engineOn) {
      var lph = 1.2 + Math.max(kw, 0) * 0.075;
      sim.fuelUsedL += lph * hrs * boost; sim.fuel -= (lph * hrs * boost) / 48 * 100;
      if (sim.soc < 30) sim.soc += 6 * hrs * boost / 18.3 * 100;
    }
    sim.soc = Math.min(100, Math.max(5, sim.soc)); sim.fuel = Math.min(100, Math.max(3, sim.fuel));
    var km = v * dt / 1000 * boost; sim.trip += km; sim.odo += km;
    var blink = Math.floor(sim.t * 2.83) % 2 === 0, d = new Date();
    return {
      speed: sim.speed, gear: sc.gear, powerKw: kw, engineOn: sim.engineOn, soc: sim.soc, fuelPct: sim.fuel,
      evRangeKm: sim.soc / 100 * 92, totalRangeKm: sim.soc / 100 * 92 + sim.fuel / 100 * 48 * 19.5,
      odoKm: sim.odo, tripKm: sim.trip, outsideC: 27,
      clock: ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2),
      turnL: sc.turn === "L" && blink, turnR: sc.turn === "R" && blink,
      warnings: []
    };
  }

  function tick() {
    var ts = Date.now(); if (sim.last == null) sim.last = ts;
    var dt = Math.min((ts - sim.last) / 1000, 0.1); sim.last = ts;
    if (!sim.paused) apply(step(dt));
  }
  if (!carMode || /demo/.test(hash)) { apply(step(0)); setInterval(tick, 50); }
  var seek = /t=(\d+)/.exec(location.search + location.hash);
  var sceneQ = /scene=(\w+)/.exec(location.search + location.hash);
  if (sceneQ && SCENES[sceneQ[1]]) sim.scene = sceneQ[1];
  if (seek) { sim.t = +seek[1]; sim.speed = sceneAt(sim.scene, sim.t).speed; }
  start();

  var btns = document.querySelectorAll("[data-sc]");
  function press(name) { Array.prototype.forEach.call(btns, function (o) { o.setAttribute("aria-pressed", o.getAttribute("data-sc") === name ? "true" : "false"); }); }
  press(sim.scene);
  Array.prototype.forEach.call(btns, function (b) {
    b.addEventListener("click", function () {
      sim.scene = b.getAttribute("data-sc"); sim.t = 0;
      if (sim.scene === "parked") sim.soc = Math.min(sim.soc, 22);
      press(sim.scene);
    });
  });
  $("sc-start").addEventListener("click", function () { sim.t = 0; shown.speed = 0; start(); });
  $("sc-pause").addEventListener("click", function () {
    sim.paused = !sim.paused; this.setAttribute("aria-pressed", sim.paused ? "true" : "false"); this.textContent = sim.paused ? "Play" : "Pause";
  });
})();
</script>
